name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: config.settings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: studcareer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-asyncio httpx factory-boy coverage
      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/studcareer_test
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          REDIS_URL: redis://localhost:6379/0
      - name: Run tests with coverage
        run: coverage run -m pytest tests/ -v
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/studcareer_test
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          REDIS_URL: redis://localhost:6379/0
      - name: Coverage report
        run: coverage report --fail-under=60
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --target production -t studcareer:latest .
      - name: Test Docker image
        run: |
          docker run --rm -d --name test-container \
            -e DJANGO_SECRET_KEY=test-key \
            -e DATABASE_URL=sqlite:///tmp/test.db \
            -p 8000:8000 \
            studcareer:latest
          sleep 5
          curl -f http://localhost:8000/admin/ || exit 1
          docker stop test-container
