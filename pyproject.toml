[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studcareer"
version = "0.1.0"
description = "Платформа для поиска стажировок СтудКарьера"
requires-python = ">=3.12"
dependencies = [
    "django>=4.2,<6.0",
    "djangorestframework>=3.15,<3.19",
    "djangorestframework-simplejwt>=5.3,<6",
    "drf-spectacular>=0.27,<1",
    "django-allauth>=65,<66",
    "django-crispy-forms>=2.1,<3",
    "crispy-tailwind>=1.0,<2",
    "django-filter>=24.3,<27",
    "daphne>=4.1,<5",
    "channels>=4.1,<5",
    "channels-redis>=4.2,<5",
    "django-axes>=6.4,<7",
    "django-csp>=4,<5",
    "django-ratelimit>=4.1,<5",
    "django-cors-headers>=4.3,<5",
    "django-cleanup>=9.0,<10",
    "celery[redis]>=5.4,<6",
    "redis>=5.0,<6",
    "psycopg2-binary>=2.9,<3",
    "gunicorn>=23.0,<24",
    "whitenoise>=6.7,<7",
    "pillow>=11,<13",
    "python-dotenv>=1.0,<2",
    "environs>=11.0,<12",
    "dj-database-url>=2.1,<4",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "factory-boy>=3.3,<4",
    "django-debug-toolbar>=4.4,<5",
    "coverage>=7.6,<8",
    "ruff>=0.5,<1",
    "pre-commit>=3.7,<4",
    "mypy>=1.10,<2",
    "django-stubs>=4.2,<6",
    "djangorestframework-stubs>=3.14,<4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (Django pattern)
    "N802",   # function name lowercase (Django views)
    "N803",   # argument name lowercase
    "N806",   # variable in function lowercase
    "UP007",  # use X | Y for union (not yet)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "ARG"]
"*/migrations/**" = ["E501", "N", "UP", "B", "A", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["accounts*", "api*", "applications*", "config*", "core*", "messaging*", "notifications*", "profiles*", "vacancies*"]
exclude = ["tests*"]

[tool.coverage.run]
source = ["accounts", "profiles", "vacancies", "applications", "api", "notifications", "messaging", "core"]

[tool.coverage.report]
show_missing = true
fail_under = 60
