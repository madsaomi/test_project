[project]
name = "studcareer"
version = "0.1.0"
description = "Платформа для поиска стажировок СтудКарьера"
requires-python = ">=3.12"
dependencies = [
    "django>=4.2,<6.0",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt>=5.3,<6",
    "django-allauth>=65,<66",
    "django-crispy-forms>=2.1,<3",
    "crispy-tailwind>=1.0,<2",
    "django-filter>=24.3,<25",
    "daphne>=4.1,<5",
    "channels>=4.1,<5",
    "channels-redis>=4.2,<5",
    "django-axes>=6.4,<7",
    "django-csp>=3.8,<4",
    "django-ratelimit>=4.1,<5",
    "django-storages>=1.14,<2",
    "django-cleanup>=9.0,<10",
    "django-extensions>=3.2,<4",
    "django-debug-toolbar>=4.4,<5",
    "celery[redis]>=5.4,<6",
    "redis>=5.0,<6",
    "psycopg2-binary>=2.9,<3",
    "asyncpg>=0.29,<1",
    "gunicorn>=23.0,<24",
    "uvicorn[standard]>=0.30,<1",
    "whitenoise>=6.7,<7",
    "pillow>=11,<13",
    "python-dotenv>=1.0,<2",
    "environs>=11.0,<12",
    "dj-database-url>=2.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "factory-boy>=3.3,<4",
    "coverage>=7.6,<8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.coverage.run]
source = ["accounts", "profiles", "vacancies", "applications", "api", "notifications", "core"]
