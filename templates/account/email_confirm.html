{% extends "layouts/guest.html" %}
{% load i18n %}
{% block title %}Подтверждение email — StudCareer{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md text-center">
        <div class="w-14 h-14 rounded-2xl bg-emerald-50 flex items-center justify-center mx-auto">
            <svg class="w-7 h-7 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mt-4">Подтверждение email</h1>
        <form method="post" action="{% url 'account_confirm_email' confirmation.key %}">
            {% csrf_token %}
            <p class="text-gray-500 mt-2">Подтвердите, что <strong>{{ confirmation.email_address.email }}</strong> — ваш email адрес</p>
            <button type="submit" class="mt-6 px-6 py-2.5 bg-gray-900 text-white font-semibold rounded-xl hover:bg-gray-800 transition-colors shadow-sm">Подтвердить</button>
        </form>
    </div>
</div>
{% endblock %}
