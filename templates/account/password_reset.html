{% extends "layouts/guest.html" %}
{% load i18n %}
{% block title %}Сброс пароля — StudCareer{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center mx-auto shadow-lg shadow-violet-200">
                <span class="text-white font-bold text-lg">SC</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mt-4 tracking-tight">Сброс пароля</h1>
            <p class="text-gray-500 mt-2">Введите email, и мы отправим инструкции</p>
        </div>
        <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm">
            <form method="post" action="{% url 'account_reset_password' %}">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
                    <input type="email" name="email" placeholder="you@example.com"
                           class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all" required>
                </div>
                <button type="submit" class="w-full mt-4 py-3 bg-gray-900 text-white font-semibold rounded-xl hover:bg-gray-800 transition-colors shadow-sm">
                    Сбросить пароль
                </button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-4">
                <a href="{% url 'account_login' %}" class="text-violet-600 hover:text-violet-700 font-medium">Вернуться ко входу</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
