{% extends "layouts/guest.html" %}
{% load i18n %}
{% block title %}Сброс пароля — StudCareer{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12 mesh-pattern">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-teal-500 to-teal-600 flex items-center justify-center mx-auto shadow-teal">
                <span class="text-white font-bold text-lg font-display">SC</span>
            </div>
            <h1 class="font-display text-2xl font-bold text-slate-900 mt-4 tracking-tight">Сброс пароля</h1>
            <p class="text-slate-500 mt-2">Введите email, и мы отправим инструкции</p>
        </div>
        <div class="bg-white rounded-2xl border border-slate-100 p-6 shadow-sm">
            <form method="post" action="{% url 'account_reset_password' %}">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
                    <input type="email" name="email" placeholder="you@example.com"
                           class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all" required>
                </div>
                <button type="submit" class="w-full mt-4 py-3 bg-gradient-to-br from-teal-500 to-teal-600 text-white font-semibold rounded-xl hover:from-teal-600 hover:to-teal-700 transition-all shadow-teal">
                    Сбросить пароль
                </button>
            </form>
            <p class="text-center text-sm text-slate-500 mt-4">
                <a href="{% url 'account_login' %}" class="text-teal-600 hover:text-teal-700 font-medium">Вернуться ко входу</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
