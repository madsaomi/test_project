{% extends "layouts/guest.html" %}
{% load i18n %}
{% block title %}Новый пароль — StudCareer{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12 mesh-pattern">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="font-display text-2xl font-bold text-slate-900">Установите новый пароль</h1>
        </div>
        <div class="bg-white rounded-2xl border border-slate-100 p-6 shadow-sm">
            <form method="post">
                {% csrf_token %}
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">Новый пароль</label>
                        <input type="password" name="password1" placeholder="Минимум 8 символов"
                               class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">Подтверждение</label>
                        <input type="password" name="password2" placeholder="Повторите пароль"
                               class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all" required>
                    </div>
                </div>
                <button type="submit" class="w-full mt-4 py-3 bg-gradient-to-br from-teal-500 to-teal-600 text-white font-semibold rounded-xl hover:from-teal-600 hover:to-teal-700 transition-all shadow-teal">Сохранить</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
