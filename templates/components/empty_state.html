<div class="text-center py-16">
    <div class="w-16 h-16 rounded-2xl bg-slate-50 flex items-center justify-center mx-auto">
        <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
        </svg>
    </div>
    <h3 class="mt-4 text-lg font-semibold text-slate-900 font-display">{{ title }}</h3>
    <p class="mt-2 text-sm text-slate-500 max-w-sm mx-auto">{{ description }}</p>
    {% if action_url and action_text %}
        <a href="{{ action_url }}" class="mt-6 inline-flex items-center px-6 py-3 bg-slate-900 text-white text-sm font-medium rounded-xl hover:bg-slate-800 transition-colors shadow-sm">
            {{ action_text }}
        </a>
    {% endif %}
</div>
